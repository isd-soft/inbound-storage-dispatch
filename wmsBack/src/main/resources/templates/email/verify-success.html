<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Account Confirmed — ISD Warehouse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: #0f172a; font-family: 'Segoe UI', Arial, sans-serif; display: flex; align-items: center; justify-content: center; }
        .card { background: #1e293b; border-radius: 16px; padding: 48px 40px; max-width: 420px; width: 90%; text-align: center; border: 1px solid #334155; }
        .icon { width: 72px; height: 72px; background: #052e16; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
        .icon svg { width: 36px; height: 36px; color: #4ade80; }
        h1 { color: #f1f5f9; font-size: 22px; font-weight: 700; margin-bottom: 12px; }
        p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
        .username { color: #4ade80; font-weight: 600; }
        .btn { display: inline-block; padding: 13px 32px; background: #4f46e5; color: #ffffff; text-decoration: none; border-radius: 10px; font-size: 15px; font-weight: 600; transition: background 0.2s; }
        .btn:hover { background: #4338ca; }
        .footer { margin-top: 24px; font-size: 12px; color: #475569; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="#4ade80" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
    </div>
    <h1>Email Confirmed!</h1>
    <p>
        Welcome, <span class="username" th:text="${username}">operator</span>!
        Your account has been activated. You can now log in to the warehouse system.
    </p>
    <a th:href="${loginUrl}" class="btn">Go to Login</a>
    <p class="footer">ISD Warehouse Management System</p>
</div>
</body>
</html>
