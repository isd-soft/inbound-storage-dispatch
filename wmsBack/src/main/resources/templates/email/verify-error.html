<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Verification Failed — ISD Warehouse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: #0f172a; font-family: 'Segoe UI', Arial, sans-serif; display: flex; align-items: center; justify-content: center; }
        .card { background: #1e293b; border-radius: 16px; padding: 48px 40px; max-width: 420px; width: 90%; text-align: center; border: 1px solid #334155; }
        .icon { width: 72px; height: 72px; background: #2d0a0a; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
        .icon svg { width: 36px; height: 36px; }
        h1 { color: #f1f5f9; font-size: 22px; font-weight: 700; margin-bottom: 12px; }
        p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
        .error { color: #f87171; font-weight: 500; }
        .footer { margin-top: 24px; font-size: 12px; color: #475569; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="#f87171" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </div>
    <h1>Verification Failed</h1>
    <p class="error" th:text="${error}">Invalid or expired token.</p>
    <p>Please ask your supervisor to resend the invitation email.</p>
    <p class="footer">ISD Warehouse Management System</p>
</div>
</body>
</html>
